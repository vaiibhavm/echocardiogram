services:
  - type: web
    name: echo-lv-api
    runtime: python
    plan: free
    rootDir: render-api
    buildCommand: pip install -r requirements.txt && python download_model.py
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeployTrigger: commit
